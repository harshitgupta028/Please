name: Deploy Release

on:
  # Automatic trigger when a release is published
  release:
    types: [published]

  # Manual trigger from Actions tab
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to deploy (leave empty for latest)"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Deployment Info
        run: |
          echo "✅ Deployment completed successfully!"
          echo "Pages URL: ${{ steps.deployment.outputs.page_url }}"
          echo "Deployed from: ${{ github.ref }}"
