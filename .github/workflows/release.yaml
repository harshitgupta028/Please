name: Create Release Tag

on:
  workflow_dispatch:
    inputs:
      release_title:
        description: "Release title/name"
        required: true
        type: string
      release_description:
        description: "Release description/notes"
        required: false
        type: string

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get branch name
        id: branch
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Get next increment number
        id: increment
        run: |
          # Get all tags matching R1.* pattern and extract the number
          LATEST_NUMBER=$(git tag -l 'R1.*' | sed 's/R1\.\([0-9]*\).*/\1/' | sort -n | tail -1)

          # If no tags exist, start at 1
          if [ -z "$LATEST_NUMBER" ]; then
            NEXT_NUMBER=1
          else
            NEXT_NUMBER=$((LATEST_NUMBER + 1))
          fi

          echo "number=$NEXT_NUMBER" >> $GITHUB_OUTPUT

      - name: Generate tag name
        id: tag
        run: |
          TAG_NAME="R1.${{ steps.increment.outputs.number }}-${{ steps.branch.outputs.name }}"
          echo "name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          release_name: ${{ github.event.inputs.release_title }}
          body: ${{ github.event.inputs.release_description }}
          draft: false
          prerelease: false

      - name: Display created tag
        run: |
          echo "✅ Release created successfully!"
          echo "Tag: ${{ steps.tag.outputs.name }}"
          echo "Title: ${{ github.event.inputs.release_title }}"
          echo "Description: ${{ github.event.inputs.release_description }}"
