name: Create Release

on:
  # Automatic trigger on push to branches
  push:
    branches: ["main", "feature/*"]

  # Manual trigger from Actions tab
  workflow_dispatch:
    inputs:
      confirm_release:
        description: "Confirm release creation"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag.outputs.name }}
      branch_name: ${{ steps.branch.outputs.name }}
      tag_exists: ${{ steps.tag_exists.outputs.exists }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get branch name
        id: branch
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Determine prefix based on branch
        id: prefix
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          if [[ "$BRANCH_NAME" == "main" ]]; then
            PREFIX="R"
          else
            PREFIX="F"
          fi
          echo "value=$PREFIX" >> $GITHUB_OUTPUT

      - name: Get next increment number
        id: increment
        run: |
          PREFIX="${{ steps.prefix.outputs.value }}"

          echo "🔍 Looking for tags matching: ${PREFIX}*.*"
          git tag -l "${PREFIX}*.*"

          # Get all tags matching the prefix pattern and extract the number
          LATEST_NUMBER=$(git tag -l "${PREFIX}*.*" | sed "s/${PREFIX}\([0-9]*\)\..*/\1/" | sort -n | tail -1)

          echo "Latest number found: $LATEST_NUMBER"

          # If no tags exist, start at 1
          if [ -z "$LATEST_NUMBER" ]; then
            NEXT_NUMBER=1
          else
            NEXT_NUMBER=$((LATEST_NUMBER + 1))
          fi

          echo "Next number: $NEXT_NUMBER"
          echo "number=$NEXT_NUMBER" >> $GITHUB_OUTPUT

      - name: Generate tag name
        id: tag
        run: |
          PREFIX="${{ steps.prefix.outputs.value }}"
          TAG_NAME="${PREFIX}${{ steps.increment.outputs.number }}.${{ steps.branch.outputs.name }}"
          echo "Generated tag: $TAG_NAME"
          echo "name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: tag_exists
        run: |
          TAG_NAME="${{ steps.tag.outputs.name }}"
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ Tag $TAG_NAME already exists."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Display waiting for confirmation
        if: steps.tag_exists.outputs.exists == 'false' && github.event_name == 'push'
        run: |
          echo ""
          echo "⏳ WAITING FOR CONFIRMATION ⏳"
          echo ""
          echo "Release Tag to be created: ${{ steps.tag.outputs.name }}"
          echo "Branch: ${{ steps.branch.outputs.name }}"
          echo ""

      - name: Create Job Summary (Waiting for confirmation)
        if: steps.tag_exists.outputs.exists == 'false' && github.event_name == 'push'
        run: |
          REPO="${{ github.repository }}"
          BRANCH="${{ steps.branch.outputs.name }}"
          TAG_NAME="${{ steps.tag.outputs.name }}"

          # Create dispatch URL with base64 encoded branch name
          DISPATCH_LINK="https://github.com/${REPO}/actions/workflows/release.yml?ref=${BRANCH}"

          echo "# ⏳ Waiting for Confirmation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release Tag:** \`${TAG_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${BRANCH}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Confirm Release Creation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[✅ CLICK HERE TO CREATE RELEASE](${DISPATCH_LINK})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Instructions:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Click the link above" >> $GITHUB_STEP_SUMMARY
          echo "2. Click the **'Run workflow'** button" >> $GITHUB_STEP_SUMMARY
          echo "3. In the dropdown, select **'Confirm release creation'**" >> $GITHUB_STEP_SUMMARY
          echo "4. Click **'Run workflow'** again to create the release" >> $GITHUB_STEP_SUMMARY

      - name: Display tag exists message
        if: steps.tag_exists.outputs.exists == 'true'
        run: |
          echo "⚠️ Tag already exists: ${{ steps.tag.outputs.name }}"

      - name: Create Job Summary (Tag already exists)
        if: steps.tag_exists.outputs.exists == 'true'
        run: |
          echo "# ⚠️ Release Already Exists!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${{ steps.tag.outputs.name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This tag has already been created. No duplicate release was generated." >> $GITHUB_STEP_SUMMARY

  generate-release:
    needs: create-release
    runs-on: ubuntu-latest
    if: needs.create-release.outputs.tag_exists == 'false' && github.event.inputs.confirm_release == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          release_name: "Release ${{ needs.create-release.outputs.tag_name }}"
          body: "Automated release created on ${{ needs.create-release.outputs.branch_name }} branch"
          draft: false
          prerelease: false

      - name: Create Job Summary (Success)
        run: |
          echo "# 🎉 Release Created Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release Tag:** \`${{ needs.create-release.outputs.tag_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ needs.create-release.outputs.branch_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📎 Quick Links" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [📦 View Release](https://github.com/${{ github.repository }}/releases/tag/${{ needs.create-release.outputs.tag_name }})" >> $GITHUB_STEP_SUMMARY
