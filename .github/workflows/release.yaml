name: Auto Create Release Tag

on:
  push:
    branches: ["main", "develop", "feature/*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get branch name
        id: branch
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Get next increment number
        id: increment
        run: |
          # Get all tags matching R1.* pattern and extract the number
          LATEST_NUMBER=$(git tag -l 'R1.*' | sed 's/R1\.\([0-9]*\).*/\1/' | sort -n | tail -1)

          # If no tags exist, start at 1
          if [ -z "$LATEST_NUMBER" ]; then
            NEXT_NUMBER=1
          else
            NEXT_NUMBER=$((LATEST_NUMBER + 1))
          fi

          echo "number=$NEXT_NUMBER" >> $GITHUB_OUTPUT

      - name: Generate tag name
        id: tag
        run: |
          TAG_NAME="R1.${{ steps.increment.outputs.number }}-${{ steps.branch.outputs.name }}"
          echo "name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Release Tag: $TAG_NAME"

      - name: Create Release Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.tag.outputs.name }}" -m "Release ${{ steps.tag.outputs.name }}"
          git push origin "${{ steps.tag.outputs.name }}"

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          release_name: ${{ steps.tag.outputs.name }}
          body: "Automated release from ${{ steps.branch.outputs.name }} branch"
          draft: false
          prerelease: false

      - name: Display created release
        run: |
          echo "✅ Release created successfully!"
          echo "Tag: ${{ steps.tag.outputs.name }}"
          echo "Branch: ${{ steps.branch.outputs.name }}"
