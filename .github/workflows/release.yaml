name: Create Release

on:
  # Automatic trigger on push to branches
  push:
    branches: ["main", "feature/*"]

  # Manual trigger from Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get branch name
        id: branch
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Determine prefix based on branch
        id: prefix
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          if [[ "$BRANCH_NAME" == "main" ]]; then
            PREFIX="R"
          else
            PREFIX="F"
          fi
          echo "value=$PREFIX" >> $GITHUB_OUTPUT

      - name: Get next increment number
        id: increment
        run: |
          PREFIX="${{ steps.prefix.outputs.value }}"

          echo "🔍 Looking for tags matching: ${PREFIX}*.*"
          git tag -l "${PREFIX}*.*"

          # Get all tags matching the prefix pattern and extract the number
          LATEST_NUMBER=$(git tag -l "${PREFIX}*.*" | sed "s/${PREFIX}\([0-9]*\)\..*/\1/" | sort -n | tail -1)

          echo "Latest number found: $LATEST_NUMBER"

          # If no tags exist, start at 1
          if [ -z "$LATEST_NUMBER" ]; then
            NEXT_NUMBER=1
          else
            NEXT_NUMBER=$((LATEST_NUMBER + 1))
          fi

          echo "Next number: $NEXT_NUMBER"
          echo "number=$NEXT_NUMBER" >> $GITHUB_OUTPUT

      - name: Generate tag name
        id: tag
        run: |
          PREFIX="${{ steps.prefix.outputs.value }}"
          TAG_NAME="${PREFIX}${{ steps.increment.outputs.number }}.${{ steps.branch.outputs.name }}"
          echo "Generated tag: $TAG_NAME"
          echo "name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: tag_exists
        run: |
          TAG_NAME="${{ steps.tag.outputs.name }}"
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ Tag $TAG_NAME already exists."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Display confirmation link (Waiting for user action)
        if: steps.tag_exists.outputs.exists == 'false'
        run: |
          REPO="${{ github.repository }}"
          RUN_ID="${{ github.run_id }}"
          TAG_NAME="${{ steps.tag.outputs.name }}"

          CONFIRMATION_LINK="https://github.com/${REPO}/actions/runs/${RUN_ID}"

          echo ""
          echo "⏳ WAITING FOR CONFIRMATION ⏳"
          echo ""
          echo "Release Tag to be created: $TAG_NAME"
          echo "Branch: ${{ steps.branch.outputs.name }}"
          echo ""
          echo "🔗 Click the link below to confirm and create the release:"
          echo "$CONFIRMATION_LINK"
          echo ""

      - name: Create Job Summary (Waiting for confirmation)
        if: steps.tag_exists.outputs.exists == 'false'
        run: |
          REPO="${{ github.repository }}"
          RUN_ID="${{ github.run_id }}"
          TAG_NAME="${{ steps.tag.outputs.name }}"

          CONFIRMATION_LINK="https://github.com/${REPO}/actions/runs/${RUN_ID}"

          echo "# ⏳ Waiting for Confirmation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release Tag:** \`$TAG_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ steps.branch.outputs.name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Confirm Release Creation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[✅ Click here to confirm and create release]($CONFIRMATION_LINK)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "After clicking the link above, re-run the workflow to create the tag." >> $GITHUB_STEP_SUMMARY

      - name: Wait for manual approval
        if: steps.tag_exists.outputs.exists == 'false'
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: ${{ github.actor }}
          issue-title: "Approve Release: ${{ steps.tag.outputs.name }}"
          issue-body: "Please approve the creation of release tag: ${{ steps.tag.outputs.name }} on branch ${{ steps.branch.outputs.name }}"

      - name: Create Release (After approval)
        if: steps.tag_exists.outputs.exists == 'false'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          release_name: "Release ${{ steps.tag.outputs.name }}"
          body: "Automated release created on ${{ steps.branch.outputs.name }} branch"
          draft: false
          prerelease: false

      - name: Generate clickable link (Success)
        id: link
        if: steps.tag_exists.outputs.exists == 'false'
        run: |
          REPO="${{ github.repository }}"
          TAG_NAME="${{ steps.tag.outputs.name }}"

          RELEASE_LINK="https://github.com/${REPO}/releases/tag/${TAG_NAME}"

          echo "release_link=$RELEASE_LINK" >> $GITHUB_OUTPUT

      - name: Display created tag with links (Success)
        if: steps.tag_exists.outputs.exists == 'false'
        run: |
          echo "✅ Release created successfully!"
          echo ""
          echo "📌 Tag: ${{ steps.tag.outputs.name }}"
          echo "🌳 Branch: ${{ steps.branch.outputs.name }}"
          echo ""
          echo "🔗 View Release:"
          echo "${{ steps.link.outputs.release_link }}"

      - name: Create Job Summary (Success)
        if: steps.tag_exists.outputs.exists == 'false'
        run: |
          echo "# 🎉 Release Created Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release Tag:** \`${{ steps.tag.outputs.name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ steps.branch.outputs.name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📎 Quick Links" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [📦 View Release](${{ steps.link.outputs.release_link }})" >> $GITHUB_STEP_SUMMARY

      - name: Tag already exists message
        if: steps.tag_exists.outputs.exists == 'true'
        run: |
          echo "⚠️ Release creation skipped!"
          echo "Tag ${{ steps.tag.outputs.name }} already exists."
          echo "No duplicate release created."

      - name: Create Job Summary (Tag exists)
        if: steps.tag_exists.outputs.exists == 'true'
        run: |
          echo "# ⚠️ Release Already Exists!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${{ steps.tag.outputs.name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This tag has already been created. No duplicate release was generated." >> $GITHUB_STEP_SUMMARY
