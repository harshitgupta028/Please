name: Create Release Tag

on:
  # Trigger on manual workflow dispatch
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.0.0)"
        required: true
        type: string
      release_name:
        description: "Release name/title"
        required: false
        type: string
      body:
        description: "Release notes/description"
        required: false
        type: string

  # Alternatively, trigger on push to main with a commit message containing [release]
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Release Tag (Manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.version }}
          release_name: ${{ github.event.inputs.release_name || github.event.inputs.version }}
          body: ${{ github.event.inputs.body }}
          draft: false
          prerelease: false

      - name: Create Release Tag (Auto on Push)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
        run: |
          # Extract version from commit message if available
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          VERSION=$(echo "$COMMIT_MSG" | grep -oP '\[release\s+\K[^]]+' || echo "v${{ github.run_number }}")

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
